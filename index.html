<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QBK">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Quỹ QBK</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#262b35;--ink:#e7e9ee;--ink2:#c3c9d3;--muted:#a3abb8;
--blue:#2f81f7;--blue2:#7ab4ff;--green:#4fd1b5;--red:#ff8a80;--amber:#f5c27a;--amberbg:#2a1e10}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:-.2px}.sub{font-size:12px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--card2);border-radius:10px;padding:10px;min-width:0}
.tile .k{font-size:11px;color:var(--muted)}.tile .v{font-size:15px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
.long{background:#0f3a33;color:var(--green)}.short{background:#3a1515;color:var(--red)}
.chip{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--ink2)}
.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
.banner{background:var(--amberbg);border:1px solid #4a3216;color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}
.agent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.av{width:30px;height:30px;border-radius:8px;background:#232833;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.agent .n{font-size:12px;font-weight:600;margin-top:6px}.agent .s{font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.bar>div{height:8px;background:var(--blue)}
pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink2);margin:0}
img.chart{width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--line)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;cursor:pointer}
.filters button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cmd{display:flex;gap:8px;align-items:center;margin-top:8px}
.cmd code{flex:1;background:var(--card2);border-radius:8px;padding:10px;font-size:13px;color:var(--blue2)}
.btn{height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #343a46;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #1e222b;padding:6px 8px calc(10px + env(safe-area-inset-bottom));z-index:6}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
nav button{height:52px;border:none;background:transparent;color:#8b94a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer;padding:0 2px;min-width:0}
nav button.on{color:var(--blue2)}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{width:100%;max-width:360px;text-align:center}
.lock input[type=password]{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:16px;margin:14px 0 10px}
.lock label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.logo{width:64px;height:64px;border-radius:18px;background:#1b3354;color:var(--blue2);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
textarea,.inp{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:12px;font-size:15px;font-family:inherit}
textarea{min-height:76px;resize:vertical}.inp{height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.red{background:transparent;border:1px solid #5a2a2a;color:var(--red)}
.reply{border-top:1px solid var(--line);padding:10px 0}.reply b{font-size:13px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
.hidden{display:none!important}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0}
.stack>div{height:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.khoi{font-size:12px;font-weight:700;color:var(--blue2);margin:14px 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl th{font-size:11px;color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}
.dept{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.dept .row b{font-size:15px}.dept .sub{margin-top:4px}
.v3d{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.v3d iframe{flex:1;border:0;width:100%}
.v3d .x3d{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:2;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.zone{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.score{font-weight:700;min-width:34px;text-align:right}
svg.spark{width:100%;height:70px;display:block}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0 4px;position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:4}
.seg button{height:38px;border:none;border-radius:9px;background:transparent;color:var(--ink2);font-size:14px;font-weight:700;cursor:pointer}
.seg button.on.spot{background:#3b2a5a;color:#d9c2ff}.seg button.on.futures{background:#17345c;color:var(--blue2)}
.tile.sp{border-left:3px solid #b58cf0}.tile.fu{border-left:3px solid var(--blue2)}
.room.sp{border-top:3px solid #b58cf0}.room.fu{border-top:3px solid var(--blue2)}
.chk{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk .n{color:var(--ink2)}.chk b{text-align:right;font-variant-numeric:tabular-nums}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--green)}.lamp.warn{background:var(--amber)}.lamp.bad{background:var(--red)}
.desk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.hero3d{background:linear-gradient(135deg,#1a2233,#201a2e)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form class="box" id="lockForm">
    <div class="logo" aria-hidden="true">Q</div>
    <h1>Quỹ QBK</h1>
    <div class="sub">Dữ liệu đã mã hóa · nhập mật khẩu app</div>
    <label for="pw" class="sr-only">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu app" required>
    <label><input type="checkbox" id="remember"> Ghi nhớ trên máy này</label>
    <button class="btn" style="width:100%" type="submit">Mở</button>
    <p id="lockMsg" class="sub bad" role="alert"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header><div class="wrap">
    <div><h1>Quỹ QBK</h1><div class="sub" id="updated"></div></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refresh" aria-label="Tải lại dữ liệu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="settings" aria-label="Cài đặt gửi lệnh">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="logout" aria-label="Khóa app">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </div></header>
  <main class="wrap" id="view"></main>
  <nav aria-label="Điều hướng chính"><div class="in" id="tabs"></div></nav>
</div>

<script>
"use strict";
const TABS = [
  ["tong", "Tổng quan", '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'],
  ["quy", "Quỹ", '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>'],
  ["hop", "Họp", '<path d="M4 5h16v11H9l-5 4z"/>'],
  ["lenh", "Lệnh", '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'],
  ["tk", "Thanh khoản", '<path d="M12 3c3 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.5 6-11z"/>'],
  ["so", "Sổ sách", '<path d="M4 19h16"/><path d="M7 15V9M12 15V5M17 15v-4"/>'],
];
let DATA = null, PASS = null, TAB = "tong", FILTER = "mo", TOKEN = null, TKSORT = "hang", TKQ = "", DESK = null;
const DESK_GRADES = {AI: ["A", "B"], E: ["E"]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (x, d = 2) => (x === null || x === undefined) ? "–" : Number(x).toLocaleString("vi-VN", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (x) => (x === null || x === undefined) ? "–" : Math.round(x * 100) + "%";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };

// ---------- giải mã (AES-256-GCM, khóa PBKDF2-SHA256, khớp qbk/crypto_box.py) ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(box, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(box.iv)}, key, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(pass) {
  const r = await fetch("data.enc.json?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error("Chưa có dữ liệu (lần chạy đầu chưa xong?)");
  return normalize(await decrypt(await r.json(), pass));
}
// dữ liệu bản cũ (trước khi chia Spot / Futures) vẫn mở được; lần chạy GitHub kế tiếp sẽ có đủ trường mới
function normalize(d) {
  const q = d.quy;
  if (q) {
    const n = q.nav;
    q.ty_le = q.ty_le || Object.fromEntries(Object.entries(q.ban || {}).map(([k, x]) => [k, x.ty_le]));
    n.spot = n.spot || {gia_tri: 0, von: 0, tien_mat: 0, lai: 0};
    n.futures = n.futures || {von: n.nav, lai: (n.lai_da_dong || 0) + (n.lai_tam_tinh || 0), long: 0, short: 0, don_bay: 0};
    n.phien = n.phien || "1"; q.gioi_han = q.gioi_han || {}; q.kiem_soat = q.kiem_soat || []; q.dong_tien = q.dong_tien || [];
    if (n.lai_pct === undefined) n.lai_pct = null;
    if (n.giu_btc_pct === undefined) n.giu_btc_pct = null;
  }
  d.lenh = d.lenh || []; d.su_kien = d.su_kien || []; d.nhan_su = d.nhan_su || [];
  return d;
}

// ---------- màn hình ----------
function pill(h) { return `<span class="pill ${h === "LONG" ? "long" : "short"}">${esc(h)}</span>`; }
function statusClass(code) { return {THANG: "ok", THUA: "bad", HUY: "", DANG_CHAY: "warn", CHO_KHOP: ""}[code] || ""; }
function copyBtn(cmd) { return `<div class="cmd"><code>${esc(cmd)}</code><button class="btn ghost" data-copy="${esc(cmd)}">Chép</button></div>`; }

// ---------- Spot / Futures: một công tắc dùng chung cho các tab Họp, Lệnh, Thanh khoản, Sổ sách ----------
let MODE = store.get("qbk_mode") === "spot" ? "spot" : "futures";
const MODE_TABS = ["hop", "lenh", "tk", "so"];
function modeSwitch() {
  return `<div class="seg" role="group" aria-label="Chọn phòng">${[["spot", "Spot"], ["futures", "Futures"]].map(([k, t]) =>
    `<button data-mode="${k}" class="${MODE === k ? "on " + k : ""}" aria-pressed="${MODE === k}">${t}</button>`).join("")}</div>`;
}
const sign = (x, d = 2) => (x === null || x === undefined) ? "–" : (x >= 0 ? "+" : "") + num(x, d);
const cls = (x) => x === null || x === undefined ? "" : x >= 0 ? "ok" : "bad";
// một dòng kiểm tra: tên · giá trị / giới hạn · đèn (ok = xanh, warn = vàng khi ≥ 70% giới hạn, bad = đỏ khi vượt)
function check(name, value, limit, txt, invert) {
  let st = "ok";
  if (limit !== null && limit !== undefined && value !== null && value !== undefined) {
    const r = Math.abs(value) / Math.abs(limit);
    st = invert ? (r <= 1 ? "bad" : "ok") : (r >= 1 ? "bad" : r >= 0.7 ? "warn" : "ok");
  }
  return `<div class="chk"><span class="lamp ${st}" aria-hidden="true"></span><span class="n">${name}</span><b class="${st === "ok" ? "" : st}">${txt}</b></div>`;
}
function flag(st, name, txt) {
  return `<div class="chk"><span class="lamp ${st}" aria-hidden="true"></span><span class="n">${name}</span><b class="${st === "ok" ? "" : st}">${txt}</b></div>`;
}

function viewTong(d) {
  const m = d.thi_truong, ai = d.chi_phi_ai, q = d.quy;
  const pending = d.lenh.filter((o) => !["C","D","E","R"].includes(o.hang) && o.giam_doc === "Duyệt" && o.chu === "Chưa trả lời" && ["CHO_KHOP","DANG_CHAY"].includes(o.ma_trang_thai));
  let h = "";
  const today = new Date().getDay();
  if (today === 0 || today === 6) h += `<div class="banner">Cuối tuần · thanh khoản mỏng, chỉ là lưu ý để cân nhắc</div>`;
  h += `<section class="card hero3d"><div class="label">Văn phòng 3D · tổng quan quỹ</div>
    <div class="sub" style="margin-bottom:10px">Nhân viên đi làm đúng việc hệ thống vừa làm (họp, đặt lệnh, Risk chặn, chốt NAV…). Lúc rảnh thì pha trà, cà phê, tán gẫu cho vui.</div>
    <div class="grid2"><button class="btn" data-3d="van-phong-3d.html">Văn phòng 3D</button><button class="btn ghost" data-3d="quy-3d.html">Đường đi lệnh 3D</button></div></section>`;
  if (q) {
    const n = q.nav, sp = q.spot || {}, fu = n.futures || {};
    h += `<section class="card"><div class="row"><b>Quỹ QBK</b><button class="btn ghost" style="height:34px" data-tab="quy">Kiểm tra quỹ</button></div>
      <div class="row" style="margin-top:8px;align-items:flex-end"><div><div class="k sub">NAV · USD ảo</div><div class="big">${num(n.nav)}</div></div>
      <div style="text-align:right"><div class="${cls(n.lai_pct)}" style="font-weight:700">${sign(n.lai_pct)}%</div><div class="sub">giữ BTC ${n.giu_btc_pct === null ? "–" : sign(n.giu_btc_pct) + "%"}</div></div></div>
      <div class="grid2" style="margin-top:10px"><div class="tile sp"><div class="k">Spot ${num(q.ty_le.SPOT || 0, 0)}%</div><div class="v">${num(sp.von ?? n.spot.gia_tri)}</div><div class="k ${cls(n.spot.lai)}">${sign(n.spot.lai)}</div></div>
      <div class="tile fu"><div class="k">Futures ${num((q.ty_le.AI || 0) + (q.ty_le.E || 0), 0)}%</div><div class="v">${num(fu.von)}</div><div class="k ${cls(fu.lai)}">${sign(fu.lai)}</div></div></div>
      ${q.canh_bao ? `<div class="banner">${esc(q.canh_bao)}</div>` : ""}${sp.ngung_mua ? `<div class="banner">Phòng Spot đang ngừng mua (sụt quá giới hạn)</div>` : ""}${q.de_xuat_cio ? `<div class="banner">CIO có đề xuất chia vốn chờ bạn duyệt · tab Quỹ</div>` : ""}</section>`;
  }
  if (m) {
    h += `<section class="card"><div class="row"><div class="label" style="margin:0">Thị trường</div><span class="sub">${esc(m.luc)}</span></div>
      <div class="row" style="margin:8px 0 12px"><div style="font-size:22px;font-weight:700">${esc(m.ma)}</div><div style="font-size:20px;font-weight:700">${num(m.gia)}</div></div>

async function sendCommands(text) {
  const lines = text.split("\n").map((x) => x.trim()).filter(Boolean);
  if (!lines.length) return;
  if (!TOKEN) { alert("Chưa có token gửi lệnh. Bấm ⚙️ để cài."); return; }
  const p = pendingInfo();
  if (p && Date.now() - p.t < WAIT_MS) { alert("Lệnh trước đang được xử lý, đợi 1–2 phút rồi gửi tiếp."); return; }
  const c = DATA.dieu_khien;
  const r = await fetch(`https://api.github.com/repos/${c.repo}/actions/workflows/${c.workflow}/dispatches`, {
    method: "POST", headers: {"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                              "X-GitHub-Api-Version": "2022-11-28"},
    body: JSON.stringify({ref: c.ref, inputs: {lenh: lines.slice(0, 10).join("\n")}})});
  if (r.status === 204) {
    store.set("qbk_sent", JSON.stringify({t: Date.now(), luc: new Date().toLocaleTimeString("vi-VN", {hour: "2-digit", minute: "2-digit"})}));
    render();
    setTimeout(async () => { try { DATA = await load(PASS); render(); } catch (_) {} }, WAIT_MS + 15000);
    return true;
  }
  const msg = {401: "Token sai hoặc đã hết hạn", 403: "Token không có quyền Actions: Read and write", 404: "Token chưa được cấp quyền cho repo QBK-Company", 422: "Workflow chưa nhận lệnh (cần Merge bản mới nhất)"}[r.status];
  alert("Không gửi được: " + (msg || ("lỗi " + r.status)));
}
// token được mã hóa bằng mật khẩu app rồi mới lưu trên máy
async function aesKey(pass, salt, usage) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 210000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, [usage]);
}
const toB64 = (u8) => btoa(String.fromCharCode(...u8));
async function saveToken(tok) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, await aesKey(PASS, salt, "encrypt"), new TextEncoder().encode(tok)));
  store.set("qbk_tok", JSON.stringify({salt: toB64(salt), iv: toB64(iv), ct: toB64(ct)}));
  TOKEN = tok;
}
async function loadToken() {
  const raw = store.get("qbk_tok"); if (!raw) return null;
  try { const b = JSON.parse(raw);
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(b.iv)}, await aesKey(PASS, b64(b.salt), "decrypt"), b64(b.ct));
    return new TextDecoder().decode(pt); } catch (_) { return null; }
}

  $("#updated").textContent = "Cập nhật " + DATA.cap_nhat;
  $("#tabs").innerHTML = TABS.map(([k, t, ic]) => `<button data-tab="${k}" class="${TAB === k ? "on" : ""}" aria-current="${TAB === k ? "page" : "false"}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>${t}</button>`).join("");
  window.QBK_DATA = DATA;                 // văn phòng 3D (cùng trang) đọc dữ liệu thật từ đây
  $("#view").innerHTML = ({tong: viewTong, quy: viewQuy, hop: viewHop, lenh: viewLenh, tk: viewTk, so: viewSo, caidat: viewCaiDat}[TAB] || viewTong)(DATA);
}

async function openApp(pass, remember) {
  DATA = await load(pass);
  PASS = pass;
  TOKEN = await loadToken();
  if (remember) store.set("qbk_pw", pass);
  $("#lock").classList.add("hidden");
  $("#app").classList.remove("hidden");
  TAB = store.get("qbk_tab") || "tong";
  if (TAB === "caidat" || TAB === "tv") TAB = "tong";
  render();
}

document.addEventListener("click", async (e) => {
  const t3 = e.target.closest("[data-3d],.x3d");
  if (t3) { const o = document.getElementById("v3d"); if (t3.classList.contains("x3d")) { o && o.remove(); return; }
    if (!o) { const want = t3.getAttribute("data-3d") || "", page = want.endsWith(".html") ? want : "van-phong-3d.html";
      const d = document.createElement("div"); d.id = "v3d"; d.className = "v3d";
      d.innerHTML = `<iframe src="${page}" title="${page.startsWith("quy") ? "Đường đi lệnh 3D" : "Văn phòng 3D"} Quỹ QBK"></iframe><button class="x3d" type="button">Đóng 3D</button>`; document.body.appendChild(d); } return; }
  const t = e.target.closest("[data-tab],[data-filter],[data-copy],[data-send],[data-tksort],[data-filter-desk],[data-filter-clear],[data-mode],[data-goto],#sendBtn,#budgetBtn,#tokSave,#tokDel,#rotBtn,#rutBtn");
  if (!t) return;
  if (t.dataset.mode) { MODE = t.dataset.mode; store.set("qbk_mode", MODE); DESK = null; render(); return; }
  if (t.dataset.goto) { const [tab, mode] = t.dataset.goto.split(":"); TAB = tab; store.set("qbk_tab", TAB); if (mode) { MODE = mode; store.set("qbk_mode", MODE); } render(); window.scrollTo(0, 0); return; }
  if (t.dataset.filterClear) { DESK = null; render(); return; }
  if (t.dataset.tksort) { TKSORT = t.dataset.tksort; render(); return; }
  if (t.dataset.filterDesk) { DESK = t.dataset.filterDesk; FILTER = "tat"; TAB = "lenh"; MODE = "futures"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "rotBtn" || t.id === "rutBtn") { const v = ($("#flowInp").value || "").replace(",", "."); if (!(+v > 0)) { alert("Nhập số tiền, ví dụ 500"); return; }
    const cmd = (t.id === "rotBtn" ? "/rotvon " : "/rutvon ") + v; if (confirm("Gửi lệnh " + cmd + "?")) await sendCommands(cmd); return; }
  if (t.dataset.send) { if (confirm(t.dataset.ask || ("Gửi lệnh " + t.dataset.send + "?"))) await sendCommands(t.dataset.send); return; }
  if (t.id === "sendBtn") { const v = $("#cmdBox").value; t.disabled = true; if (!(await sendCommands(v))) t.disabled = false; return; }
  if (t.id === "budgetBtn") { const v = ($("#budgetInp").value || "").replace(",", "."); if (!(+v > 0) || v === "") { alert("Nhập số tiền, ví dụ 200"); return; } await sendCommands("/ngansach " + v); return; }
  if (t.id === "tokSave") { const v = $("#tokInp").value.trim(); if (!v) return; await saveToken(v); render(); return; }
  if (t.id === "tokDel") { store.del("qbk_tok"); TOKEN = null; render(); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; store.set("qbk_tab", TAB); render(); window.scrollTo(0, 0); }
  if (t.dataset.filter) { FILTER = t.dataset.filter; render(); }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = "Đã chép"; } catch (_) { t.textContent = "Không chép được"; } }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "tkSearch") { TKQ = e.target.value; const box = $("#tkList"); if (box) box.innerHTML = tkList(DATA); }
});
$("#lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#lockMsg").textContent = "Đang giải mã…";
  try { await openApp($("#pw").value, $("#remember").checked); $("#lockMsg").textContent = ""; }
  catch (err) { $("#lockMsg").textContent = err.name === "OperationError" ? "Sai mật khẩu" : (err.message || "Không mở được"); }
});
$("#refresh").addEventListener("click", async () => { try { DATA = await load(PASS); render(); } catch (err) { alert(err.message); } });
$("#logout").addEventListener("click", () => { store.del("qbk_pw"); location.reload(); });
$("#settings").addEventListener("click", () => { TAB = "caidat"; render(); window.scrollTo(0, 0); });
setInterval(async () => { if (PASS && document.visibilityState === "visible") { try { DATA = await load(PASS); render(); } catch (_) {} } }, 5 * 60 * 1000);
(async () => { const p = store.get("qbk_pw"); if (p) { try { await openApp(p, true); } catch (_) { store.del("qbk_pw"); } } })();
</script>
</body>
</html>

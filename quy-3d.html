<title>Quỹ QBK 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sàn quỹ 3D toàn màn hình; trên là thanh kịch bản, dưới là bảng bước đang chạy và thẻ vị trí */
:root{
  --bg:#e4e9ee; --panel:rgba(255,255,255,.9); --fg:#15212c; --muted:#5a6876; --line:rgba(21,33,44,.13);
  --btn:#ffffff; --accent:#0f6e7a; --on-accent:#fff;
  --ai:#6a3fb5; --code:#1f7a4d; --nguoi:#0f6e7a; --stop:#b3361f; --ok:#1f7a4d;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171d; --panel:rgba(22,30,38,.9); --fg:#e4ecf1; --muted:#93a3b1; --line:rgba(228,236,241,.14);
  --btn:#1d2731; --accent:#4fc0cc; --on-accent:#0b1418;
  --ai:#b597ef; --code:#5fcf93; --nguoi:#4fc0cc; --stop:#f0806a; --ok:#5fcf93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171d; --panel:rgba(22,30,38,.9); --fg:#e4ecf1; --muted:#93a3b1; --line:rgba(228,236,241,.14);
  --btn:#1d2731; --accent:#4fc0cc; --on-accent:#0b1418;
  --ai:#b597ef; --code:#5fcf93; --nguoi:#4fc0cc; --stop:#f0806a; --ok:#5fcf93; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.nm{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;display:flex;gap:5px;align-items:center}
.nm b{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.03em}
.nm b.ai{color:var(--ai)} .nm b.code{color:var(--code)} .nm b.nguoi{color:var(--nguoi)}
.tag.on .nm{outline:2px solid var(--accent)}
.tag.dim{opacity:.35}
.hide-names .tag:not(.on) .nm{display:none}
.bubble{max-width:200px;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:10px;background:#fff;color:#15212c;box-shadow:0 4px 14px rgba(0,0,0,.2);text-align:center;text-wrap:balance;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.bubble.block{background:#fbe7e2;color:#7a1f10}.bubble.block::after{background:#fbe7e2}
.bubble.pass{background:#e3f3ea;color:#124d30}.bubble.pass::after{background:#e3f3ea}
.zone{position:absolute;left:0;top:0;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(10,20,30,.12)}
.ui{position:fixed;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:8px}
.ui>*{pointer-events:auto}
header.ui{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.brand{padding:8px 14px;display:flex;flex-direction:column;justify-content:center}
.brand small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand strong{font-size:16px;font-weight:700}
.legend{display:flex;gap:10px;align-items:center;padding:6px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.scen{display:flex;gap:6px;overflow-x:auto;padding:6px;scrollbar-width:none;max-width:100%}
.scen::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit}
.chip{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--btn);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer.ui{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#flow{padding:12px 14px;width:min(430px,100%);display:flex;flex-direction:column;gap:8px}
#flow .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#flow h2{margin:0;font-size:14px;font-weight:700}
#flow .ctl{display:flex;gap:6px}
#flow .ctl .chip{height:30px;padding:0 10px;font-size:12px}
#now{font-size:13.5px;line-height:1.45;min-height:2.9em}
#now .who{font-weight:700}
#steps{display:flex;gap:4px}
#steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
#steps span.done{background:var(--accent)}
#steps span.cur{background:var(--accent);opacity:.55}
#note{font-size:11px;color:var(--muted)}
#card{padding:12px 14px;width:min(430px,100%);display:flex;flex-direction:column;gap:6px}
#card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#card h3{margin:0;font-size:16px}
#card .sub{font-size:12.5px;color:var(--muted)}
#card dl{margin:4px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px}
#card dt{color:var(--muted)} #card dd{margin:0}
#card dd.no{color:var(--stop)}
#card code{font-family:var(--f-mono);font-size:11.5px}
.x{height:28px;width:28px;border-radius:8px;border:1px solid var(--line);background:var(--btn);cursor:pointer;flex:none}
@media (max-width:640px){ .legend{display:none} .brand strong{font-size:14px} }
</style>

  <section id="card" class="panel" hidden aria-live="polite">

  </section>
</footer>

  add(scene,B(w,0.3,d),M(new THREE.Color(z.color).lerp(new THREE.Color('#eef1f4'),.62).getStyle()),cx,k==='top'?0.6:0,cz,false);
  add(scene,B(w+0.1,0.06,d+0.1),M(z.color),cx,k==='top'?0.43:-0.16,cz,false);
  if(k==='top'){ add(scene,B(w,0.45,d),M('#d5dbe1'),cx,0.22,cz,false); }
  const el=document.createElement('div'); el.className='zone'; el.textContent=z.name; el.style.background=z.color; $('#tags').appendChild(el);
  zoneEls.push({el,pos:new V3(cx,k==='top'?0.8:0.2,cz+d/2+0.1)});
}
add(scene,new THREE.PlaneGeometry(400,400),M('#aebaa9'),0,-0.2,0,false).rotation.x=-Math.PI/2;
// két lưu ký cạnh Kiểm toán
{const [cx,cz]=ORG.out; const g=new THREE.Group(); g.position.set(cx+1.3,0.15,cz-0.9); scene.add(g);
 add(g,B(1,1.1,0.8),M('#3c4650',{metalness:.4,roughness:.4}),0,0.55,0); add(g,C(.13,.13,.05,16),M('#c9a227',{metalness:.6}),0,.62,.42).rotation.x=Math.PI/2;}

function cellPos(id,zone,cell){
  const [cx,cz]=ORG[zone];
  if(zone==='top') return new V3(cx+cell[0]*1.6,0.75,cz);
  if(zone==='out') return new V3(cx-0.8,0.15,cz+0.4);
  const rows=zone==='fo'?3:2;
  return new V3(cx+(cell[0]-1)*CELL.x, 0.15, cz+(cell[1]-(rows-1)/2)*CELL.z);
}

/* ---------- người + bàn ---------- */
const pickables=[];
function person(d){
  const [id,name,zone,type,model,doing,no,src,cell]=d;
  const pos=cellPos(id,zone,cell);
  const g=new THREE.Group(); g.position.copy(pos); scene.add(g);
  const col=TYPE_COL[type];
  // bàn + màn hình
  add(g,B(1.5,0.05,0.75),M('#d8ccb8'),0,0.74,-0.55);
  for(const sx of[-.68,.68]) add(g,B(.05,.72,.05),M('#5a626c'),sx,.36,-0.55);
  add(g,B(.62,.38,.04),M('#1d232b'),0,1.12,-0.8);
  const scr=add(g,new THREE.PlaneGeometry(.56,.32),new THREE.MeshBasicMaterial({color:col}),0,1.12,-0.775,false);
  scr.material=scr.material.clone(); scr.material.color.set(col).lerp(new THREE.Color('#ffffff'),.35);
  // ghế
  add(g,B(.5,.07,.48),M('#3a424c'),0,.46,0.15); add(g,B(.5,.5,.07),M('#3a424c'),0,.74,.42);
  // người que khối
  const body=new THREE.Group(); body.position.set(0,0,0.12); g.add(body);
  add(body,C(.17,.2,.55,14),M(col),0,.82,0);
  const hd=add(body,S(.15),M('#f0c9a4'),0,1.27,0);
  add(body,new THREE.SphereGeometry(.16,16,10,0,Math.PI*2,0,Math.PI*.55),M('#22180f'),0,1.3,.01);
  const aL=new THREE.Group(),aR=new THREE.Group(); aL.position.set(-.22,1.02,0); aR.position.set(.22,1.02,0); body.add(aL,aR);
  for(const a of[aL,aR]) add(a,C(.05,.045,.42,8),M(col),0,-.2,0);
  aL.rotation.x=aR.rotation.x=-1.1;
  // vòng sáng dưới chân khi đang làm
  const ring=new THREE.Mesh(new THREE.RingGeometry(.75,.92,40),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.03; g.add(ring);
  const o={id,name,zone,type,model,doing,no,src,g,body,hd,aL,aR,ring,scr,pos,t:Math.random()*9,act:0};
  g.traverse(m=>{if(m.isMesh){m.userData.p=o; pickables.push(m);}});
  const el=document.createElement('div'); el.className='tag';
  el.innerHTML='<div class="bubble" hidden></div><div class="nm">'+name+' <b class="'+type+'">'+(type==='ai'?'AI':type==='code'?'CODE':'CHỦ')+'</b></div>';
  $('#tags').appendChild(el); o.el=el; o.bub=el.querySelector('.bubble');
  BY[id]=o; return o;
}
const PEOPLE=P.map(person);

/* ---------- token chạy theo quy trình ---------- */
const tokGeo=new THREE.SphereGeometry(.22,20,14);
const tokens=[];
function spawnToken(from,to,color,dur){
  const m=new THREE.Mesh(tokGeo,new THREE.MeshBasicMaterial({color}));
  scene.add(m);
  const trail=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.25,depthWrite:false})); m.add(trail);
  const a=from.clone().add(new V3(0,1.6,0)), b=to.clone().add(new V3(0,1.6,0));
  const mid=a.clone().lerp(b,.5); mid.y+=Math.min(6,1.2+a.distanceTo(b)*.35);
  tokens.push({m,a,b,mid,t:0,dur});
}
function tickTokens(dt){
  for(let i=tokens.length-1;i>=0;i--){
    const k=tokens[i]; k.t+=dt/k.dur; const t=Math.min(1,k.t), u=1-t;
    k.m.position.set(u*u*k.a.x+2*u*t*k.mid.x+t*t*k.b.x, u*u*k.a.y+2*u*t*k.mid.y+t*t*k.b.y, u*u*k.a.z+2*u*t*k.mid.z+t*t*k.b.z);
    if(k.t>=1.15){ scene.remove(k.m); tokens.splice(i,1); }
  }
}

/* ---------- chạy kịch bản ---------- */
const R={key:'ai',i:-1,timer:0,phase:'move',paused:false,prev:[]};
const MOVE=1.1, HOLD=2.4;
function ids(x){return Array.isArray(x)?x:[x];}
function setScenario(k){
  R.key=k; R.i=-1; R.timer=0; R.prev=[]; R.phase='hold';
  PEOPLE.forEach(p=>{p.act=0; p.bub.hidden=true;});
  const sc=SC[k];
  $('#fTitle').textContent=sc.title;
  $('#steps').innerHTML=sc.steps.map(()=>'<span></span>').join('');
  document.querySelectorAll('#scen .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));
  const inv=new Set(sc.steps.flatMap(s=>ids(s[0])));
  PEOPLE.forEach(p=>p.el.classList.toggle('dim',!inv.has(p.id)));
  $('#note').textContent=(sc.note?sc.note+' ':'')+'Luồng theo docs/QUY_QBK.md. Chạm một người để xem việc của họ.';
  nextStep();
}
function nextStep(){
  const sc=SC[R.key];
  R.i++;
  if(R.i>=sc.steps.length){ R.i=-1; R.prev=[]; R.phase='rest'; R.timer=1.8; PEOPLE.forEach(p=>{p.act=0;p.bub.hidden=true;}); return; }
  const [who,text,gate]=sc.steps[R.i], to=ids(who);
  const color=gate==='block'?css('--stop')||'#b3361f':gate==='pass'?'#2fae6c':'#f0b429';
  PEOPLE.forEach(p=>{ if(!to.includes(p.id)){p.act=Math.max(0,p.act-1); p.bub.hidden=true;} });
  if(R.prev.length){ for(const t of to) spawnToken(BY[R.prev[0]].pos,BY[t].pos,color,MOVE); R.phase='move'; R.timer=MOVE; }
  else { R.phase='hold'; R.timer=HOLD; }
  R.pending={to,text,gate}; R.prev=to;
  if(R.phase!=='move') arrive(); // bước đầu hiện ngay
  [...$('#steps').children].forEach((s,j)=>{s.className=j<R.i?'done':j===R.i?'cur':'';});
  const names=to.map(t=>BY[t].name).join(' ‖ ');
  $('#now').innerHTML='<span class="who">'+(R.i+1)+'. '+names+'</span><br>'+text;
}
function arrive(){
  const {to,text,gate}=R.pending;
  to.forEach((t,j)=>{ const p=BY[t]; p.act=2;
    if(j===0||to.length<=2){ p.bub.textContent=to.length>2?text:short(text); p.bub.className='bubble'+(gate?' '+gate:''); p.bub.hidden=false; }
    if(gate==='block') flash(p,'#e04b2d'); });
  R.phase='hold'; R.timer=HOLD+(to.length>1?.6:0);
}
function short(t){ return t.length>70?t.slice(0,68).replace(/\s\S*$/,'')+'…':t; }
function flash(p,c){ p.scr.material.color.set(c); setTimeout(()=>p.scr.material.color.set(TYPE_COL[p.type]).lerp(new THREE.Color('#ffffff'),.35),1800); }
function tickRun(dt){
  if(R.paused) return;
  R.timer-=dt;
  if(R.timer>0) return;
  if(R.phase==='move') arrive();
  else nextStep();
}

/* ---------- UI ---------- */
const scen=$('#scen');
for(const k in SC){ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.k=k; b.textContent=SC[k].name; b.addEventListener('click',()=>{R.paused=false; $('#pBtn').textContent='Tạm dừng'; setScenario(k);}); scen.appendChild(b); }
$('#pBtn').addEventListener('click',e=>{R.paused=!R.paused; e.currentTarget.textContent=R.paused?'Chạy tiếp':'Tạm dừng';});
$('#nBtn').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',String(on)); document.body.classList.toggle('hide-names',!on);});
$('#oBtn').addEventListener('click',()=>flyTo(OVER.p,OVER.t));
let sel=null;
function select(p){
  if(sel) sel.el.classList.remove('on');
  sel=p; const card=$('#card');
  if(!p){card.hidden=true; return;}
  p.el.classList.add('on');
  $('#cName').textContent=p.name;
  $('#cSub').textContent=ZONES[p.zone].name+' · '+p.model;
  $('#cDo').textContent=p.doing; $('#cNo').textContent=p.no; $('#cSrc').textContent=p.src;
  card.hidden=false;
  const tgt=p.pos.clone().setY(1); const off=camera.position.clone().sub(controls.target).setLength(portrait?16:13); if(off.y<6)off.y=6;
  flyTo(tgt.clone().add(off),tgt);
}
$('#cClose').addEventListener('click',()=>select(null));
const ray=new THREE.Raycaster(), mv=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return;
  mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mv,camera);
  const h=ray.intersectObjects(pickables,false)[0]; select(h?h.object.userData.p:null);
});

/* ---------- camera ---------- */
const OVER={p:new V3(),t:new V3()};
function overview(){
  const a=innerWidth/innerHeight;
  if(portrait){ OVER.p.set(0,58,30); OVER.t.set(0,0,1); }
  else if(a<1.3){ OVER.p.set(4,36,30); OVER.t.set(4,0,-1); }
  else { OVER.p.set(2,27,25); OVER.t.set(2,0,-1); }
}
let fly=null;
function flyTo(p,t){ fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),k:reduce?1:0}; }
function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); overview(); }
resize(); camera.position.copy(OVER.p); controls.target.copy(OVER.t);
addEventListener('resize',resize);

/* ---------- vòng lặp ---------- */
const tmp=new V3(); let last=performance.now();
function project(v,el,dy){
  tmp.copy(v); tmp.project(camera);
  if(tmp.z>1){el.style.visibility='hidden';return;}
  el.style.visibility='';
  const x=(tmp.x*.5+.5)*innerWidth, y=(-tmp.y*.5+.5)*innerHeight;
  el.style.transform='translate(-50%,-100%) translate('+x.toFixed(1)+'px,'+(y-(dy||0)).toFixed(1)+'px)';
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(fly){ fly.k=Math.min(1,fly.k+dt*1.6); const e=fly.k<.5?2*fly.k*fly.k:1-Math.pow(-2*fly.k+2,2)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(fly.k>=1) fly=null; }
  controls.update();
  tickRun(dt); tickTokens(dt);
  for(const p of PEOPLE){
    p.t+=dt; const on=p.act>=2;
    const tgtOp=on?.85:0; p.ring.material.opacity+=(tgtOp-p.ring.material.opacity)*Math.min(1,dt*6);
    if(on){ const s=1+Math.sin(p.t*5)*.06; p.ring.scale.set(s,s,s); }
    p.body.position.y=on&&!reduce?Math.abs(Math.sin(p.t*4))*.08:0;
    p.aL.rotation.x=-1.1+(on?Math.sin(p.t*9)*.25:Math.sin(p.t*14)*.04);
    p.aR.rotation.x=-1.1+(on?Math.sin(p.t*9+1.5)*.25:Math.sin(p.t*14+1.7)*.04);
    p.hd.rotation.y=Math.sin(p.t*.7)*.25;
    p.el.classList.toggle('on',on||p===sel);
    project(p.pos.clone().setY(p.pos.y+1.75),p.el);
  }
  for(const z of zoneEls) project(z.pos,z.el,-22);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
setScenario('ai');
requestAnimationFrame(loop);
})();
</script>
